<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Number 1 : 5</h1>
    <h1>Number 2 : 10</h1>
    <p id="un"></p>
    <p id="un1"></p>
    <p id="un2"></p>
    <p id="un3"></p>
    <script>
        let n1 = 10;
        let n2 = 5;
        let shuma = n1 + n2;
        document.getElementById("un").innerHTML = "Sum is: " + shuma;
        let zbritja = n1 - n2;
        document.getElementById("un1").innerHTML = "Deduction is: " + zbritja;
        let prodhimi = n1 * n2;
        document.getElementById("un2").innerHTML = "Multiplication is: " + prodhimi;
        let pjestimi = n1 / n2;
        document.getElementById("un3").innerHTML = "Division is: " + pjestimi;
    </script>
</body>
</html>
