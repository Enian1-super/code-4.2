<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="id" min="100" max="300" required>
    <p id="result"></p>
    <button onclick="myFun()" type="submit"></button>

    <script>
        function myFun() {
            var a = document.getElementById("id");

            if(!a.checkValidity()){
                document.getElementById("result").innerHTML = a.validationMessage;
            }
            else {
                document.getElementById("result").innerHTML = "Input OK";
            }
        }
    </script>
</body>
</html>
