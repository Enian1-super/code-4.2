<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <p id="demoo"></p>
    <script>
        var x = 20;
        var y = 40;

        document.getElementById("demo").innerHTML = x + y;

        document.getElementById("demoo").innerHTML = String(x) + String(y);
    </script>
</body>
</html>
